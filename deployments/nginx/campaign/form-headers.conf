# Headers of the campaign form page (FEATURES/12), on the desk host (/r/{token}) and on the
# forms host (/{token}). The page may load a Google Tag Manager container, so its scripts are
# allowed here and nowhere else. It can only call the public form API on its own host
# (connect-src has no 'self'), and no other site may frame it.
add_header Cache-Control "no-cache" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.googletagmanager.com https://*.google-analytics.com https://*.google.com https://*.doubleclick.net https://connect.facebook.net https://analytics.tiktok.com; connect-src $http_host/api/v1/public/ https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://*.google.com https://*.doubleclick.net https://*.facebook.com https://analytics.tiktok.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://*.googletagmanager.com; font-src 'self' data:; frame-src https://*.googletagmanager.com https://*.doubleclick.net https://*.facebook.com; frame-ancestors 'none'; form-action 'none'; base-uri 'none'; object-src 'none'" always;
