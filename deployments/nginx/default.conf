server {
    listen 80;
    server_name _;

    # Docker DNS, re-resolved every 10 s: a recreated api container gets a new IP, and a
    # static upstream would keep answering 502 until nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # Excel import uploads (EMS_IMPORT_MAX_BYTES is enforced again in the API).
    client_max_body_size 25m;

    # TLS terminates in front of this container in production; add HSTS there.

    location /api/ {
        # Security headers for API responses come from the app (app/core/middleware.py).
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        # The scanner PWA will need camera=(self) on its own location once it is served.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        default_type text/plain;
        return 200 "EMS API is running. Frontend is not built yet.\n";
    }
}
