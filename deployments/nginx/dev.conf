# Dev: /api to the API container, everything else to the Vite dev server (with HMR).
server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $web_upstream http://web:5173;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Campaign forms: the `make campaign` dev server on the host (production serves /r/ from
    # the web image). Links made in the admin use this port, so they open here too.
    location /r/ {
        # Fixed name, read from /etc/hosts at start (Docker DNS does not know host.docker.internal).
        proxy_pass http://host.docker.internal:5175;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
