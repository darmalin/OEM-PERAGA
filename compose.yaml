name: ems

x-backend: &backend
  build:
    context: ./backend
    target: prod
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    EMS_ENVIRONMENT: ${EMS_ENVIRONMENT:-production}
    EMS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ems}:${POSTGRES_PASSWORD:-ems}@postgres:5432/${POSTGRES_DB:-ems}
    EMS_REDIS_URL: redis://redis:6379/0
    EMS_CELERY_BROKER_URL: redis://redis:6379/1
    EMS_S3_ENDPOINT_URL: http://storage:9000
    EMS_S3_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-ems}
    EMS_S3_SECRET_KEY: ${STORAGE_SECRET_KEY:-ems-storage-secret}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    storage:
      condition: service_started
  restart: unless-stopped

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ems}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ems}
      POSTGRES_DB: ${POSTGRES_DB:-ems}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deployments/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # S3-compatible object storage (MinIO no longer publishes Docker Hub images).
  storage:
    image: rustfs/rustfs:1.0.1
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-ems}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-ems-storage-secret}
    volumes:
      - storage-data:/data
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli ensure-buckets"]
    restart: "no"

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker", "worker", "-Q", "default,email,import,export,reports", "--loglevel", "INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    <<: *backend
    command: ["celery", "-A", "app.worker", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Web entry point: the built SPA plus the /api proxy (frontend/Dockerfile).
  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${EMS_HTTP_PORT:-8080}:80"
    environment:
      # Campaign forms on their own host (FEATURES/12); empty keeps them at /r/ on this host.
      EMS_CAMPAIGN_BASE_URL: ${EMS_CAMPAIGN_BASE_URL:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  storage-data:
