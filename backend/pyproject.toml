[project]
name = "ems-backend"
version = "0.1.0"
description = "EMS Visitor CRM backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "boto3==1.43.115",
    "celery[redis]==5.6.3",
    "cryptography==50.0.2",
    "fastapi==0.151.0",
    "gunicorn==26.2.0",
    "jinja2==3.1.6",
    "openpyxl==3.1.5",
    "phonenumbers==9.0.41",
    "pwdlib[argon2]==0.3.1",
    "pydantic-settings==2.16.0",
    "pydantic[email]==2.14.1",
    "python-multipart==0.0.32",
    "redis==6.4.0",
    "segno==1.6.6",
    "sqlalchemy[asyncio]==2.1.5",
    "structlog==26.1.0",
    "uuid6==2025.0.1",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "celery-types==0.26.0",
    "httpx==0.28.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
    "types-boto3[s3]==1.43.115",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "N", "RUF"]
# N818: error names (NotFound, Conflict, ...) are fixed by BACKEND_RULES/coding-standards.md.
ignore = ["B008", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"migrations/**" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.File", "fastapi.Form"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
files = ["app"]

[[tool.mypy.overrides]]
module = ["segno.*", "openpyxl.*", "phonenumbers.*", "uuid6.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
